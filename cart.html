<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Giỏ hàng - HHHMOBILE STORE</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>
<link rel="stylesheet" href="chatbot.css">
<script src="chatbot.js"></script>

<body>

    <!-- ================= HEADER ================= -->

    <header class="header">

        <div class="container header-container">

            <a
                href="index.html"
                class="logo"
            >
                📱 HHHMOBILE STORE
            </a>


            <nav class="nav">

                <a href="index.html">
                    Trang chủ
                </a>

                <a href="products.html">
                    Sản phẩm
                </a>

                <a href="orders.html">
                    Đơn hàng
                </a>

                <a
                    href="cart.html"
                    class="active cart-link"
                >
                    🛒 Giỏ hàng
                    <span id="cartCount">
                        0
                    </span>
                </a>


                <div
                    id="userArea"
                    class="user-area"
                >

                    <a
                        href="login.html"
                        class="login-btn"
                    >
                        Đăng nhập
                    </a>

                </div>

            </nav>

        </div>

    </header>


    <!-- ================= CART ================= -->

    <main class="cart-page">

        <div class="container">

            <div class="page-heading">

                <p>
                    SHOPPING CART
                </p>

                <h1>
                    Giỏ hàng của bạn
                </h1>

            </div>


            <div
                id="cartContent"
                class="cart-content"
            >

                <!-- JavaScript sẽ hiển thị giỏ hàng ở đây -->

            </div>

        </div>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <div class="footer-bottom">

            <p>
                © 2026 HHHMOBILE STORE. All rights reserved.
            </p>

        </div>

    </footer>


    <!-- ================= JAVASCRIPT ================= -->

    <script
        type="module"
        src="js/firebase.js"
    ></script>

    <script
        type="module"
        src="js/auth.js"
    ></script>

    <script
        src="js/cart.js"
    ></script>

</body>

</html>
