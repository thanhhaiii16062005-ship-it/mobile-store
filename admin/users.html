<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quản lý người dùng - Mobile Store</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">

        <div class="container header-container">

            <a href="index.html" class="logo">
                📱 MOBILE STORE
            </a>

            <nav class="nav">

                <a href="index.html">
                    Dashboard
                </a>

                <a href="products.html">
                    Sản phẩm
                </a>

                <a href="categories.html">
                    Danh mục
                </a>

                <a href="orders.html">
                    Đơn hàng
                </a>

                <a href="users.html" class="active">
                    Người dùng
                </a>

            </nav>

        </div>

    </header>


    <!-- MAIN -->
    <main class="admin-page">

        <div class="container">

            <!-- PAGE TITLE -->
            <div class="page-heading">

                <p>USER MANAGEMENT</p>

                <h1>Quản lý người dùng</h1>

                <span>
                    Quản lý danh sách tài khoản khách hàng của Mobile Store
                </span>

            </div>


            <!-- SEARCH -->
            <section class="admin-form-card">

                <div class="admin-section-title">

                    <div>

                        <p>USER SEARCH</p>

                        <h2>Tìm kiếm người dùng</h2>

                    </div>

                </div>


                <div class="form-group">

                    <label for="userSearch">
                        Tìm kiếm
                    </label>

                    <input
                        type="text"
                        id="userSearch"
                        placeholder="Nhập email hoặc tên người dùng..."
                    >

                </div>

            </section>


            <!-- USER LIST -->
            <section class="admin-table-card">

                <div class="admin-section-title">

                    <div>

                        <p>USER LIST</p>

                        <h2>Danh sách người dùng</h2>

                    </div>

                </div>


                <div id="userList">

                    <div class="loading-products">
                        Đang tải người dùng...
                    </div>

                </div>

            </section>

        </div>

    </main>


    <!-- FOOTER -->
    <footer class="footer">

        <div class="footer-bottom">

            <p>
                © 2026 Mobile Store. All rights reserved.
            </p>

        </div>

    </footer>


    <!-- JAVASCRIPT -->
    <script type="module" src="users.js"></script>

</body>

</html>
