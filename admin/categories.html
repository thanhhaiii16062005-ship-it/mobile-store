<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quản lý danh mục - Mobile Store</title>

    <link rel="stylesheet" href="../css/style.css">
</head>


<body>

    <!-- ================= HEADER ================= -->

    <header class="header">

        <div class="container header-container">

            <a href="index.html" class="logo">
                📱 MOBILE STORE
            </a>


            <nav class="nav">

                <a href="index.html">
                    Dashboard
                </a>

                <a href="products.html">
                    Sản phẩm
                </a>

                <a href="categories.html" class="active">
                    Danh mục
                </a>

                <a href="orders.html">
                    Đơn hàng
                </a>

                <a href="users.html">
                    Người dùng
                </a>

            </nav>

        </div>

    </header>


    <!-- ================= MAIN ================= -->

    <main class="admin-page">

        <div class="container">

            <div class="page-heading">

                <p>
                    ADMINISTRATION
                </p>

                <h1>
                    Quản lý danh mục
                </h1>

            </div>


            <!-- ================= FORM ================= -->

            <section class="admin-form-card">

                <h2>
                    Thêm danh mục
                </h2>


                <form id="categoryForm">

                    <div class="form-group">

                        <label for="categoryName">
                            Tên danh mục
                        </label>

                        <input
                            type="text"
                            id="categoryName"
                            placeholder="Ví dụ: iPhone"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        ➕ Thêm danh mục
                    </button>

                </form>

            </section>


            <!-- ================= DANH SÁCH ================= -->

            <section class="admin-table-card">

                <div class="admin-section-title">

                    <div>

                        <p>
                            CATEGORY LIST
                        </p>

                        <h2>
                            Danh sách danh mục
                        </h2>

                    </div>

                </div>


                <div id="categoryList">

                    <div class="loading-products">
                        Đang tải danh mục...
                    </div>

                </div>

            </section>

        </div>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <div class="footer-bottom">

            <p>
                © 2026 Mobile Store. All rights reserved.
            </p>

        </div>

    </footer>


    <!-- ================= JAVASCRIPT ================= -->

    <script
        type="module"
        src="categories.js"
    ></script>

</body>

</html>
